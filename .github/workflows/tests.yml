name: Public Skill Installer Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned optional workspace dependencies
        run: python -m pip install -r requirements-workspace.txt
      - name: Python regression suite (synthetic machinery, not live host acceptance)
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
      - name: Compile Python modules
        run: python -m compileall -q tools tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: regression-${{ matrix.os }}
          path: test-results.txt
          retention-days: 30

      - name: Windows friend bootstrap parse, preview and sandbox install
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $syntaxErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\\install.ps1').Path, [ref]$tokens, [ref]$syntaxErrors) | Out-Null
          if ($syntaxErrors.Count -gt 0) { $syntaxErrors | Out-String | Write-Error; exit 1 }
          $sandbox = Join-Path $env:RUNNER_TEMP 'aka-chef-test-codex'
          $skillsRoot = Join-Path $env:RUNNER_TEMP 'aka-chef-test-skills'
          & .\\install.ps1 -SourceDirectory . -CodexHome $sandbox -SkillsRoot $skillsRoot -SkipCodexCheck
          if ($LASTEXITCODE -ne 0 -or (Test-Path $sandbox) -or (Test-Path $skillsRoot)) { throw 'Bootstrap preview changed files or failed' }
          & .\\install.ps1 -SourceDirectory . -CodexHome $sandbox -SkillsRoot $skillsRoot -SkipCodexCheck -Apply
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap install failed' }
          & .\\install.ps1 -SourceDirectory . -CodexHome $sandbox -SkillsRoot $skillsRoot -SkipCodexCheck -Apply
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap second install not idempotent' }
          # Unauthenticated remote code must fail closed, even in preview mode.
          & .\\install.ps1 -SkipCodexCheck
          if ($LASTEXITCODE -eq 0) { throw 'Missing provenance unexpectedly allowed remote source' }
          # The rejection above is expected; pwsh propagates the last native exit code.
          $global:LASTEXITCODE = 0
          if (-not (Test-Path (Join-Path $sandbox 'AGENTS.md'))) { throw 'Global rules missing' }
          foreach ($role in @('research', 'coding', 'qa', 'automation')) {
            if (-not (Test-Path (Join-Path $sandbox ("agents/" + $role + ".toml")))) { throw "Missing role: $role" }
          }

      - name: Real Tk widget smoke on Linux virtual display
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python -m unittest discover -s tests -p 'test_gui*.py' -v
          xvfb-run -a python -m unittest discover -s tests -p 'test_workspace_gui.py' -v
          xvfb-run -a python -m tools.workspace_gui --smoke-test

  workspace-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint workspace modules and tests
        run: python -m ruff check tools/personal_workspace.py tools/workspace_*.py tools/gui_installer.py tests/test_personal_workspace.py tests/test_workspace_*.py
      - name: Type check workspace function bodies
        run: python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports tools/personal_workspace.py tools/workspace_*.py

  workspace-windows-package:
    runs-on: windows-latest
    # Build/test artifact only. No release, deploy, signing identity or live OAuth.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build workspace-enabled EXE
        shell: pwsh
        env:
          CHEF_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python -m pip install -r requirements-workspace.txt 'PyInstaller==6.22.3'
          if ($LASTEXITCODE -ne 0) { throw 'Build dependencies failed' }
          python -m PyInstaller --clean --noconfirm chef-gui.spec
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $homeBefore = Join-Path $env:RUNNER_TEMP 'workspace-smoke-empty-profile'
          $env:USERPROFILE = $homeBefore
          $env:HOME = $homeBefore
          $env:CODEX_HOME = Join-Path $homeBefore '.codex'
          $process = Start-Process -FilePath (Resolve-Path 'dist/AKA-CRISTI-CHEF-Setup.exe') -ArgumentList '--workspace-smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Workspace EXE smoke timed out' }
          if ($process.ExitCode -ne 0) { throw 'Workspace EXE smoke failed' }
          if (Test-Path $homeBefore) { throw 'Smoke wrote user configuration' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-workspace-gui-test-only
          path: dist/AKA-CRISTI-CHEF-Setup.exe
          retention-days: 14
