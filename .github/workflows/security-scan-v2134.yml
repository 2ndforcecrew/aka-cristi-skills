name: Security rescan v2.13.4 (source and exact candidate)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact PR revision without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.13 (scanner requires 3.12+)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install immutable upstream SkillSpector 2.13.4
        run: |
          python -m pip install 'git+https://github.com/NVIDIA/SkillSpector.git@54824463814a0be01360792523ec7245a69190fc'
          skillspector --version
      - name: Build exact committed deterministic source archive (not a release)
        shell: bash
        run: |
          python -m tools.release_package --commit "$(git rev-parse HEAD)" --version 0.0.0-security-recheck --out "$RUNNER_TEMP/candidate"
      - name: Scan entire checkout and actual deterministic archive independently
        shell: bash
        run: |
          set +e
          skillspector scan . --no-llm --format json --fail-on-incomplete > "$RUNNER_TEMP/full-source.json" 2> "$RUNNER_TEMP/full-source.stderr"
          source_exit=$?
          skillspector scan "$RUNNER_TEMP/candidate/aka-cristi-skills-0.0.0-security-recheck.zip" --no-llm --format json --fail-on-incomplete > "$RUNNER_TEMP/exact-package.json" 2> "$RUNNER_TEMP/exact-package.stderr"
          package_exit=$?
          echo "SOURCE_SCAN_EXIT=$source_exit" >> "$GITHUB_ENV"
          echo "PACKAGE_SCAN_EXIT=$package_exit" >> "$GITHUB_ENV"
          # An incomplete/unsafe scan is expected to exit 1; it must still be audited.
          exit 0
      - name: Evaluate unsuppressed coverage, findings and scanner status (fail closed)
        if: always()
        shell: bash
        run: |
          python -m tools.scan_report_gate \
            --source "$RUNNER_TEMP/full-source.json" \
            --package "$RUNNER_TEMP/exact-package.json" \
            --source-exit "${SOURCE_SCAN_EXIT:-2}" \
            --package-exit "${PACKAGE_SCAN_EXIT:-2}" \
            --commit "$(git rev-parse HEAD)" \
            --scanner-commit 54824463814a0be01360792523ec7245a69190fc \
            --output "$RUNNER_TEMP/security-scan-summary.json"
      - name: Archive reproducible scan evidence (not approval)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillspector-2134-audit
          path: |
            ${{ runner.temp }}/security-scan-summary.json
          retention-days: 14
          if-no-files-found: warn
