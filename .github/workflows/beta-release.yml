name: Publish verified Codex-first Windows beta v1.0.0-beta.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/beta-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    if: github.repository == '2ndforcecrew/aka-cristi-skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Source regression tests
        run: python -m unittest discover -s tests -v
      - name: Assert unified one-command installer is present and executable
        run: |
          git ls-files --error-unmatch tools/quick_install.py tests/test_quick_install.py
          python -m unittest discover -s tests -p 'test_quick_install.py' -v
          python -m tools.quick_install --help
      - name: Deterministic archive twice
        shell: bash
        run: |
          python -m tools.release_package --commit "$GITHUB_SHA" --version 1.0.0-beta.2 --out candidate
          python -m tools.release_package --commit "$GITHUB_SHA" --version 1.0.0-beta.2 --out comparison
          cmp candidate/aka-cristi-skills-1.0.0-beta.2.zip comparison/aka-cristi-skills-1.0.0-beta.2.zip
          python - <<'PY'
          import os, zipfile
          with zipfile.ZipFile('candidate/aka-cristi-skills-1.0.0-beta.2.zip') as archive:
              names = archive.namelist()
              assert any(n.endswith('/tools/quick_install.py') for n in names), 'Missing unified CLI installer'
              assert any(n.endswith('/tests/test_quick_install.py') for n in names), 'Missing quick installer tests'
          PY
      - name: GitHub provenance for exact source files
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          create-storage-record: false
          subject-path: |
            candidate/aka-cristi-skills-1.0.0-beta.2.zip
            candidate/release-manifest.json
      - name: Preserve source proof
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" candidate/provenance.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-source
          path: candidate/
          if-no-files-found: error

  windows-gui:
    if: github.repository == '2ndforcecrew/aka-cristi-skills' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Source GUI tests and smoke
        run: |
          python -m unittest discover -s tests -p 'test_gui*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'GUI tests failed' }
          python -m unittest discover -s tests -p test_install_transaction.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Install tests failed' }
          python -m tools.gui_installer --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Tk smoke failed' }
      - name: Frozen Windows executable
        run: |
          $env:CHEF_SOURCE_COMMIT = $env:GITHUB_SHA
          $env:CHEF_BUILD_METADATA_DIR = Join-Path $env:RUNNER_TEMP 'chef-gui-metadata'
          python -m pip install --index-url https://pypi.org/simple 'PyInstaller==6.22.3'
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller install failed' }
          python -m PyInstaller --clean --noconfirm chef-gui.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          Copy-Item (Join-Path $env:CHEF_BUILD_METADATA_DIR 'bundled-public-data.json') 'dist/bundled-public-data.json'
      - name: Run frozen executable without profile writes
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP ('beta-exe-' + [guid]::NewGuid().ToString('N'))
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = (Resolve-Path 'dist/AKA-CRISTI-CHEF-Setup.exe').Path
          $start.Arguments = '--smoke-test'
          $start.UseShellExecute = $false
          $start.EnvironmentVariables['HOME'] = Join-Path $sandbox 'profile'
          $start.EnvironmentVariables['USERPROFILE'] = Join-Path $sandbox 'profile'
          $start.EnvironmentVariables['CODEX_HOME'] = Join-Path $sandbox 'codex'
          $process = [System.Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'EXE smoke timeout' }
          if ($process.ExitCode -ne 0) { throw "EXE smoke failed $($process.ExitCode)" }
          if (Test-Path $sandbox) { throw 'EXE unexpectedly wrote profile files' }
          'PASS: EXE startup; EXTERNAL_UAT=NOT_RUN; AUTHENTICODE=NOT_SIGNED' | Set-Content 'dist/exe-smoke-evidence.txt'
      - name: Windows candidate SHA256 manifest
        run: |
          @'
          import hashlib, json, os
          from pathlib import Path
          names = ('AKA-CRISTI-CHEF-Setup.exe','bundled-public-data.json','exe-smoke-evidence.txt')
          files = {name: hashlib.sha256((Path('dist')/name).read_bytes()).hexdigest() for name in names}
          manifest = {'source_commit':os.environ['GITHUB_SHA'],'source_ref':os.environ['GITHUB_REF'],'version':'v1.0.0-beta.2','files':files,'authenticode':'NOT_SIGNED','external_windows_uat':'NOT_RUN','agent_activation':'NOT_RUN','workflow':'.github/workflows/beta-release.yml'}
          Path('dist/gui-candidate-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True),encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed' }
      - name: GitHub provenance for Windows binary and manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          create-storage-record: false
          subject-path: |
            dist/AKA-CRISTI-CHEF-Setup.exe
            dist/gui-candidate-manifest.json
            dist/bundled-public-data.json
            dist/exe-smoke-evidence.txt
      - name: Preserve EXE proof
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination 'dist/gui-provenance.sigstore.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-windows
          path: dist/
          if-no-files-found: error

  publish:
    needs: [source, windows-gui]
    if: github.repository == '2ndforcecrew/aka-cristi-skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: beta-source
          path: publish/source
      - uses: actions/download-artifact@v4
        with:
          name: beta-windows
          path: publish/gui
      - name: Verify exact source, EXE, manifest digests and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          src=pathlib.Path('publish/source')
          m=json.loads((src/'release-manifest.json').read_text())
          assert m['source_commit']==os.environ['GITHUB_SHA']
          zipfile=src/m['archive']
          assert zipfile.is_file()
          assert hashlib.sha256(zipfile.read_bytes()).hexdigest()==m['sha256']
          gui=pathlib.Path('publish/gui')
          g=json.loads((gui/'gui-candidate-manifest.json').read_text())
          assert g['source_commit']==os.environ['GITHUB_SHA']
          assert g['authenticode']=='NOT_SIGNED'
          for filename,digest in g['files'].items():
              assert hashlib.sha256((gui/filename).read_bytes()).hexdigest()==digest,filename
          PY
          gh --version
          python - <<'PY'
          import re,subprocess
          result=subprocess.run(['gh','--version'],check=True,capture_output=True,text=True)
          m=re.search(r'gh version (\d+)\.(\d+)\.(\d+)',result.stdout)
          assert m and tuple(map(int,m.groups())) >= (2,102,0),'gh 2.102.0+ required'
          PY
          for f in publish/source/aka-cristi-skills-1.0.0-beta.2.zip publish/source/release-manifest.json; do
            gh attestation verify "$f" --bundle publish/source/provenance.sigstore.json --repo 2ndforcecrew/aka-cristi-skills --signer-workflow 2ndforcecrew/aka-cristi-skills/.github/workflows/beta-release.yml --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --predicate-type https://slsa.dev/provenance/v1
          done
          for f in publish/gui/AKA-CRISTI-CHEF-Setup.exe publish/gui/gui-candidate-manifest.json publish/gui/bundled-public-data.json publish/gui/exe-smoke-evidence.txt; do
            gh attestation verify "$f" --bundle publish/gui/gui-provenance.sigstore.json --repo 2ndforcecrew/aka-cristi-skills --signer-workflow 2ndforcecrew/aka-cristi-skills/.github/workflows/beta-release.yml --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --predicate-type https://slsa.dev/provenance/v1
          done
      - name: Publish pre-release only after verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0-beta.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Beta release already exists; refusing overwrite"
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          # AKA.CRISTI Skills v1.0.0-beta.2 — Windows public beta

          **公开测试版，不是稳定版。仅建议在隔离的 Windows 11 测试用户配置或虚拟机中使用。**

          包含 Codex-first CHEF 工作规则、四个方法论 Skills、四个 Codex 角色定义、受控本地安装器与 Windows GUI。

          **本版本新增：一条命令安装 Codex 核心配置（Windows / macOS / Ubuntu）**。准备 Git 与 Python 3.11+，打开终端执行：

          Windows PowerShell：
          ```powershell
          git clone https://github.com/2ndforcecrew/aka-cristi-skills.git; if ($LASTEXITCODE -ne 0) { throw 'Clone failed' }; cd aka-cristi-skills; git checkout v1.0.0-beta.2; if ($LASTEXITCODE -ne 0) { throw 'Tag checkout failed' }; py -3 -m tools.quick_install --interactive
          ```

          macOS / Ubuntu / Linux：
          ```bash
          git clone https://github.com/2ndforcecrew/aka-cristi-skills.git && cd aka-cristi-skills && git checkout v1.0.0-beta.2 && python3 -m tools.quick_install --interactive
          ```

          安装器先显示完整预览；**用户必须输入 `INSTALL`** 才会安装 CHEF 全局 AGENTS.md、4 个 Skills 和 4 个 Codex 自定义角色，并执行文件完整性校验。只会调用本地安装逻辑，不会自动登录 Codex 或使用推理额度。安装前检查仓库来源及文件变更；如果已有同名目录，请先备份并阅读差异。

          **下载前核验：** 附件包括 Windows EXE、源码 ZIP、对应 SHA-256 manifest 以及 GitHub OIDC / Sigstore 来源证明。GitHub 来源证明不等于 Windows Authenticode 证书；此 EXE **没有 Authenticode 签名**，可能出现 Windows 安全警告。不要绕过组织安全策略或忽略来源校验。

          **当前限制：** 外部 Windows 11 首次安装 UAT、当前发布版本四角色真实联动、独立账户下的 MCP 权限验证仍待收集证据；Personal AI Workspace OAuth 与真实私人仓库创建、ChatGPT/Hermes/Claude 联动尚不属于稳定支持能力。请勿用于生产系统、真实客户资料或重要账户。

          **测试建议：** 使用干净用户配置，先 Preview，检查 AGENTS.md 差异；再测试安装、重复安装、撤销、异常恢复。请通过 GitHub Issues 提交脱敏的测试结果和问题。

          参考 [Windows GUI 限制](https://github.com/2ndforcecrew/aka-cristi-skills/blob/main/docs/WINDOWS_GUI.md)、[Beta 验收说明](https://github.com/2ndforcecrew/aka-cristi-skills/blob/main/docs/CODEX_V1_RELEASE_ACCEPTANCE.md)。
          EOF
          gh release create v1.0.0-beta.2 \
            publish/source/aka-cristi-skills-1.0.0-beta.2.zip \
            publish/source/release-manifest.json \
            publish/source/provenance.sigstore.json \
            publish/gui/AKA-CRISTI-CHEF-Setup.exe \
            publish/gui/gui-candidate-manifest.json \
            publish/gui/gui-provenance.sigstore.json \
            publish/gui/bundled-public-data.json \
            publish/gui/exe-smoke-evidence.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title 'AKA.CRISTI Skills v1.0.0-beta.2 (Windows Beta)' \
            --notes-file release-notes.md
