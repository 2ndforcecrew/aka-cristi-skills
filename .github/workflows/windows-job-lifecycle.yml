name: Windows Job Object safe lifecycle
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-job-object:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Syntax of verifier and helper
        run: python -m py_compile tools/verify_four_agents.py tools/aka_windows_job_runner.py
      - name: Windows parent/child/unrelated regression (no Codex)
        run: python -m unittest discover -s tests -p test_windows_job_runner.py -v
